name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Already published immutable stable tag to verify and repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-pi-context-broker
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest
    environment: npm-publish
    outputs:
      verified_artifact: ${{ steps.release_inputs.outputs.artifact }}
    permissions:
      contents: read
      id-token: write
    env:
      NTN_SKILLS_BUILD_ENTRY: ${{ github.workspace }}/.verification/ntn-skills-cli/packages/cli/dist/ntn-skills.js
      CONTEXT_BROKER_GRAPH_CORE: ${{ github.workspace }}/.verification/ntn-skills-cli/packages/core/src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Select frozen CLI input
        id: cli-input
        run: echo "revision=$(cat .github/ntn-skills-cli-revision)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned CLI SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yoyooyooo/notion-skills-cli
          ref: ${{ steps.cli-input.outputs.revision }}
          path: .verification/ntn-skills-cli
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install supported npm
        run: npm install --global npm@12.2.3 --registry https://registry.npmjs.org
      - name: Validate release source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          release_tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          mode=new
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            mode=repair
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/tags/$release_tag" ]; then
            echo "Repair must be dispatched on its immutable tag ref." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/broker-release"
          node scripts/release-evidence.mjs source "$release_tag" "$mode" "$GITHUB_WORKSPACE/.verification/ntn-skills-cli" "$RUNNER_TEMP/broker-release/source.json"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=pi-context-broker" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${release_tag#v}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build pinned CLI SDK
        working-directory: .verification/ntn-skills-cli
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Check current Broker
        run: bun run check:broker
      - name: Release policy regression
        run: node --test scripts/release.test.mjs
      - name: Package release artifacts
        run: bun scripts/pack.mjs --target broker --out-dir "$RUNNER_TEMP/broker-release"
      - name: Select release archive
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP/broker-release/"*.tgz)
          test "${#archives[@]}" -eq 1
          echo "TARBALL=${archives[0]}" >> "$GITHUB_ENV"
      - name: Create current SDK fixture
        run: node .verification/ntn-skills-cli/scripts/sdk-fixture.ts --outdir "$RUNNER_TEMP/ntn-skills-current-fixture" --catalog
      - name: Installed current SDK consumption
        run: node scripts/verify-artifacts.mjs --fixture "$RUNNER_TEMP/ntn-skills-current-fixture/fixture.json" --source-http-helper "$GITHUB_WORKSPACE/.verification/ntn-skills-cli/scripts/sdk-source-fixture.mjs" --archive "$TARBALL" --report "$RUNNER_TEMP/broker-release/installed.json"
      - name: Record the checked candidate
        run: node scripts/release-evidence.mjs candidate "$RUNNER_TEMP/broker-release/source.json" "$TARBALL" "$RUNNER_TEMP/broker-release/installed.json" "$RUNNER_TEMP/broker-release/candidate.json"
      - name: Reconcile npm presence
        run: node scripts/release-evidence.mjs presence "$RUNNER_TEMP/broker-release/candidate.json" "$RUNNER_TEMP/broker-release/presence.json"
      - name: Publish the checked archive
        run: |
          already_published="$(node -p "require(process.argv[1]).alreadyPublished" "$RUNNER_TEMP/broker-release/presence.json")"
          if [ "$already_published" = true ]; then
            echo "The exact archive already exists; continuing readback without republishing."
            exit 0
          fi
          test "$already_published" = false
          npm publish "$TARBALL" --ignore-scripts --registry https://registry.npmjs.org --access public --provenance --tag latest
      - name: Verify registry, cold install, and provenance
        run: node scripts/release-evidence.mjs verify "$RUNNER_TEMP/broker-release/candidate.json" "$RUNNER_TEMP/broker-release/presence.json" "$RUNNER_TEMP/broker-release/registry.json"
      - name: Generate release notes
        run: |
          git fetch --tags
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { writeFileSync } = require("node:fs");

          const packageName = process.env.PACKAGE_NAME;
          const currentVersion = process.env.PACKAGE_VERSION;
          const currentTag = process.env.RELEASE_TAG;

          function run(command, args) {
            return execFileSync(command, args, { encoding: "utf8" }).trim();
          }

          function stable(value) {
            return /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(value);
          }

          function parts(value) {
            return value.split(".").map(Number);
          }

          function compare(left, right) {
            const l = parts(left);
            const r = parts(right);
            return l[0] - r[0] || l[1] - r[1] || l[2] - r[2];
          }

          function tagExists(tag) {
            try {
              execFileSync("git", ["rev-parse", "-q", "--verify", `refs/tags/${tag}`], { stdio: "ignore" });
              return true;
            } catch {
              return false;
            }
          }

          const rawVersions = run("npm", ["view", packageName, "versions", "--json", "--registry", "https://registry.npmjs.org"]);
          const parsed = JSON.parse(rawVersions || "[]");
          const versions = (Array.isArray(parsed) ? parsed : [parsed]).filter((value) => typeof value === "string" && stable(value));
          const previousVersion = versions.filter((version) => compare(version, currentVersion) < 0).sort(compare).at(-1);
          const previousTag = previousVersion && tagExists(`v${previousVersion}`) ? `v${previousVersion}` : "";
          const range = previousTag ? `${previousTag}..${currentTag}` : currentTag;

          let rawLog = "";
          try {
            rawLog = run("git", ["log", "--format=%H%x1f%s%x1f%b%x1e", range]);
          } catch {
            rawLog = "";
          }

          const sections = [
            ["breaking", "Breaking Changes"],
            ["feat", "Features"],
            ["fix", "Fixes"],
            ["perf", "Performance"],
            ["refactor", "Refactors"],
            ["docs", "Docs"],
            ["test", "Tests"],
            ["maintenance", "Maintenance"],
            ["other", "Other"],
          ];
          const groups = Object.fromEntries(sections.map(([key]) => [key, []]));
          const typeMap = new Map([
            ["feat", "feat"],
            ["fix", "fix"],
            ["perf", "perf"],
            ["refactor", "refactor"],
            ["docs", "docs"],
            ["test", "test"],
            ["chore", "maintenance"],
            ["build", "maintenance"],
            ["ci", "maintenance"],
          ]);

          for (const entry of rawLog.split("\x1e")) {
            const trimmed = entry.trim();
            if (!trimmed) continue;
            const [sha = "", subject = "", body = ""] = trimmed.split("\x1f");
            if (/^chore: release v\d+\.\d+\.\d+$/.test(subject)) continue;
            const match = subject.match(/^([a-zA-Z]+)(?:\(([^)]+)\))?(!)?:\s+(.+)$/);
            const breaking = Boolean(match?.[3]) || /(^|\n)BREAKING CHANGE:/m.test(body);
            const type = match?.[1]?.toLowerCase() ?? "";
            const scope = match?.[2] ? `**${match[2]}:** ` : "";
            const summary = match?.[4] ?? subject;
            const item = `${scope}${summary} (${sha.slice(0, 7)})`;
            if (breaking) {
              groups.breaking.push(item);
              continue;
            }
            groups[typeMap.get(type) ?? "other"].push(item);
          }

          const lines = [`# ${currentTag}`, ""];
          if (previousTag) {
            lines.push(`Changes since ${previousTag}.`, "");
          }
          let wroteSection = false;
          for (const [key, title] of sections) {
            const items = groups[key];
            if (items.length === 0) continue;
            wroteSection = true;
            lines.push(`## ${title}`, "");
            for (const item of items) lines.push(`- ${item}`);
            lines.push("");
          }
          if (!wroteSection) {
            lines.push("No user-facing changes.", "");
          }
          writeFileSync("release-notes.md", lines.join("\n"));
          NODE
      - name: Preserve current SDK results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-current-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/broker-artifacts-*/
            ${{ runner.temp }}/ntn-skills-current-fixture/
            ${{ runner.temp }}/broker-release/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Stage verified release inputs
        id: release_inputs
        run: |
          mkdir "$RUNNER_TEMP/release-upload"
          cp "$TARBALL" "$RUNNER_TEMP/broker-release/candidate.json" "$RUNNER_TEMP/broker-release/registry.json" release-notes.md "$RUNNER_TEMP/release-upload/"
          echo "artifact=verified-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Preserve verified release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release_inputs.outputs.artifact }}
          path: ${{ runner.temp }}/release-upload/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download verified release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.main.outputs.verified_artifact }}
          path: verified-release
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Create or repair GitHub Release after registry verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          archive="verified-release/pi-context-broker-${RELEASE_TAG#v}.tgz"
          node scripts/release-evidence.mjs github-release verified-release/candidate.json verified-release/registry.json verified-release/release-notes.md "$archive"
      - name: Preserve GitHub reconciliation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-release/*.github-commands.json
          if-no-files-found: warn
          retention-days: 7
