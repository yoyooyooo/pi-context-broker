name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next
      - benchmark

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NTN_SKILLS_BUILD_ENTRY: ${{ github.workspace }}/.verification/ntn-skills-cli/packages/cli/dist/ntn-skills.js
      CONTEXT_BROKER_GRAPH_CORE: ${{ github.workspace }}/.verification/ntn-skills-cli/packages/core/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout pinned CLI SDK
        uses: actions/checkout@v4
        with:
          repository: yoyooyooo/notion-skills-cli
          ref: 18e48d567f4e1f4963bd63be55476e1ae60a71e2
          path: .verification/ntn-skills-cli
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build pinned CLI SDK
        working-directory: .verification/ntn-skills-cli
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Check current Broker
        run: bun run check:broker
      - name: Release policy regression
        run: node --test scripts/release.test.mjs
      - name: Create current SDK fixture
        run: node .verification/ntn-skills-cli/scripts/sdk-fixture.ts --outdir "$RUNNER_TEMP/ntn-skills-current-fixture" --catalog
      - name: Installed current SDK consumption
        run: node scripts/verify-artifacts.mjs --fixture "$RUNNER_TEMP/ntn-skills-current-fixture/fixture.json" --source-http-helper "$GITHUB_WORKSPACE/.verification/ntn-skills-cli/scripts/sdk-source-fixture.mjs"
      - name: Preserve current SDK results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-current-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/broker-artifacts-*/
            ${{ runner.temp }}/ntn-skills-current-fixture/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
