name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NTN_SKILLS_BUILD_ENTRY: ${{ github.workspace }}/.verification/ntn-skills-cli/packages/cli/dist/ntn-skills.js
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout pinned CLI SDK
        uses: actions/checkout@v4
        with:
          repository: yoyooyooo/notion-skills-cli
          ref: 6ccabe6d6cc9231d4321f324c06854e0fce1730e
          path: .verification/ntn-skills-cli
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build pinned CLI SDK
        working-directory: .verification/ntn-skills-cli
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install pinned CLI hosts
        run: npm install --global @oh-my-pi/pi-coding-agent@18.10.3 @earendil-works/pi-coding-agent@1.5.0
      - name: Check
        run: bun run check
      - name: Release policy regression
        run: node --test scripts/release.test.mjs
      - name: Native CLI host regressions
        id: native-hosts
        run: |
          node packages/context-broker/scripts/context-broker-host-e2e.mjs
          node packages/context-broker/scripts/context-broker-global-config-e2e.mjs
          node packages/context-broker/scripts/context-broker-lifecycle-e2e.mjs
      - name: Preserve failed native host evidence
        if: failure() && steps.native-hosts.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: native-host-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/context-broker-host-e2e-*/
            /tmp/context-broker-config-e2e-*/
            /tmp/context-broker-lifecycle-e2e-*/
          if-no-files-found: warn
          retention-days: 7
      - name: Create controlled SDK fixture
        run: node .verification/ntn-skills-cli/scripts/sdk-fixture.ts --outdir "$RUNNER_TEMP/ntn-skills-sdk-fixture" --catalog
      - name: Create controlled name SDK fixture
        run: node .verification/ntn-skills-cli/scripts/sdk-fixture.ts --outdir "$RUNNER_TEMP/ntn-skills-name-fixture" --catalog --distinct-names
      - name: Create controlled ambiguity SDK fixture
        run: node .verification/ntn-skills-cli/scripts/sdk-fixture.ts --outdir "$RUNNER_TEMP/ntn-skills-ambiguity-fixture" --catalog --ambiguous-names
      - name: Installed Pi artifact regression
        id: installed-pi
        shell: bash
        run: |
          node scripts/verify-artifacts.mjs --host pi --fixture "$RUNNER_TEMP/ntn-skills-sdk-fixture/fixture.json" --require-sdk --name-fixture "$RUNNER_TEMP/ntn-skills-name-fixture/fixture.json" --ambiguity-fixture "$RUNNER_TEMP/ntn-skills-ambiguity-fixture/fixture.json" | tee "$RUNNER_TEMP/installed-pi-artifact.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join, isAbsolute } from 'node:path';
          const matches = [...readFileSync(join(process.env.RUNNER_TEMP, 'installed-pi-artifact.log'), 'utf8').matchAll(/^Artifact workspace retained: (.+)$/gm)];
          assert.equal(matches.length, 1);
          const manifest = JSON.parse(readFileSync(join(matches[0][1], 'manifest.json'), 'utf8'));
          assert.equal(manifest.status, 'passed'); assert.equal(manifest.hostIdentity.version, '1.5.0');
          assert.equal(manifest.defaultSdk.status, 'passed'); assert.ok(isAbsolute(manifest.package.installed));
          assert.equal(manifest.namedSdk.status, 'passed');
          assert.equal(manifest.ambiguitySdk.status, 'passed');
          appendFileSync(process.env.GITHUB_OUTPUT, 'package=' + manifest.package.installed + '\n');
          NODE
      - name: Installed Pi controlled HTTP consumption
        id: controlled-http
        env:
          BROKER_INSTALLED_PACKAGE: ${{ steps.installed-pi.outputs.package }}
        run: |
          for scenario in http-directory http-cache-recovery http-interruption; do
            node scripts/notion-sdk-pi.mjs run --package "$BROKER_INSTALLED_PACKAGE" --fixture "$RUNNER_TEMP/ntn-skills-sdk-fixture/fixture.json" --source-http-helper "$GITHUB_WORKSPACE/.verification/ntn-skills-cli/scripts/sdk-source-fixture.mjs" --scenario "$scenario" --out "$RUNNER_TEMP/pi15-$scenario-evidence"
          done
      - name: Pi 1.4 compatibility
        env:
          BROKER_INSTALLED_PACKAGE: ${{ steps.installed-pi.outputs.package }}
        run: |
          npm install --prefix "$RUNNER_TEMP/pi14-compat" --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
          export PATH="$RUNNER_TEMP/pi14-compat/node_modules/.bin:$PATH"
          test "$(pi --version)" = "1.4.0"
          node packages/context-broker/scripts/context-broker-host-e2e.mjs pi
          node scripts/notion-sdk-pi.mjs run --package "$BROKER_INSTALLED_PACKAGE" --fixture "$RUNNER_TEMP/ntn-skills-sdk-fixture/fixture.json" --scenario all --out "$RUNNER_TEMP/pi14-sdk-evidence"
          for scenario in name-references name-reference-failed-source; do
            node scripts/notion-sdk-pi.mjs run --package "$BROKER_INSTALLED_PACKAGE" --fixture "$RUNNER_TEMP/ntn-skills-name-fixture/fixture.json" --scenario "$scenario" --out "$RUNNER_TEMP/pi14-$scenario-evidence"
          done
          node scripts/notion-sdk-pi.mjs run --package "$BROKER_INSTALLED_PACKAGE" --fixture "$RUNNER_TEMP/ntn-skills-ambiguity-fixture/fixture.json" --scenario name-reference-ambiguity --out "$RUNNER_TEMP/pi14-name-reference-ambiguity-evidence"
          node scripts/notion-sdk-pi.mjs run --package "$BROKER_INSTALLED_PACKAGE" --fixture "$RUNNER_TEMP/ntn-skills-sdk-fixture/fixture.json" --source-http-helper "$GITHUB_WORKSPACE/.verification/ntn-skills-cli/scripts/sdk-source-fixture.mjs" --scenario http-directory --out "$RUNNER_TEMP/pi14-http-directory-evidence"
      - name: Installed Pi current-context contract
        env:
          BROKER_INSTALLED_PACKAGE: ${{ steps.installed-pi.outputs.package }}
        run: |
          for backend in in-process http; do
            node scripts/notion-sdk-pi.mjs run --package "$BROKER_INSTALLED_PACKAGE" --fixture "$RUNNER_TEMP/ntn-skills-sdk-fixture/fixture.json" --scenario context-once --provider-backend "$backend" --out "$RUNNER_TEMP/pi15-context-once-$backend"
          done
          node scripts/notion-sdk-pi.mjs run --package "$BROKER_INSTALLED_PACKAGE" --fixture "$RUNNER_TEMP/ntn-skills-sdk-fixture/fixture.json" --scenario session-compaction --out "$RUNNER_TEMP/pi15-context-once-compaction"
          node scripts/notion-sdk-pi.mjs run --package "$BROKER_INSTALLED_PACKAGE" --fixture "$RUNNER_TEMP/ntn-skills-sdk-fixture/fixture.json" --scenario context-wire-negative --provider-backend http --out "$RUNNER_TEMP/pi15-context-once-wire-negative"
      - name: Preserve installed Pi SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-pi-sdk-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/broker-artifacts-*/
            /tmp/notion-sdk-pi-*/
            /tmp/context-broker-host-e2e-*/
            ${{ runner.temp }}/ntn-skills-sdk-fixture/
            ${{ runner.temp }}/ntn-skills-name-fixture/
            ${{ runner.temp }}/ntn-skills-ambiguity-fixture/
            ${{ runner.temp }}/pi14-sdk-evidence/
            ${{ runner.temp }}/pi14-name-references-evidence/
            ${{ runner.temp }}/pi14-name-reference-failed-source-evidence/
            ${{ runner.temp }}/pi14-name-reference-ambiguity-evidence/
            ${{ runner.temp }}/pi15-http-*-evidence/
            ${{ runner.temp }}/pi14-http-directory-evidence/
            ${{ runner.temp }}/pi15-context-once-*/
            ${{ runner.temp }}/installed-pi-artifact.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Installed OMP and Tern artifact regression
        run: node scripts/verify-artifacts.mjs --host omp
      - name: Package dry run
        run: bun run pack:dry
