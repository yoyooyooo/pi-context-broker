name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next
      - benchmark

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        node: [24.22.3, 26.13.1]
    runs-on: ubuntu-latest
    env:
      NTN_SKILLS_BUILD_ENTRY: ${{ github.workspace }}/.verification/ntn-skills-cli/packages/cli/dist/ntn-skills.js
      CONTEXT_BROKER_GRAPH_CORE: ${{ github.workspace }}/.verification/ntn-skills-cli/packages/core/src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select frozen CLI input
        id: cli-input
        run: echo "revision=$(cat .github/ntn-skills-cli-revision)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned CLI SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yoyooyooo/notion-skills-cli
          ref: ${{ steps.cli-input.outputs.revision }}
          path: .verification/ntn-skills-cli
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build pinned CLI SDK
        working-directory: .verification/ntn-skills-cli
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Directory inventory evidence
        run: node --test scripts/notion-agent-inventory-evidence.test.mjs
      - name: Check current Broker
        run: bun run check:broker
      - name: Release policy regression
        run: node --test scripts/release.test.mjs
      - name: Benchmark protocol, corpus and offline analysis
        if: github.base_ref == 'benchmark' || github.ref == 'refs/heads/benchmark'
        run: bun run test:benchmark
      - name: Create current SDK fixture
        run: node .verification/ntn-skills-cli/scripts/sdk-fixture.ts --outdir "$RUNNER_TEMP/ntn-skills-current-fixture" --catalog
      - name: Installed current SDK consumption
        run: node scripts/verify-artifacts.mjs --fixture "$RUNNER_TEMP/ntn-skills-current-fixture/fixture.json" --source-http-helper "$GITHUB_WORKSPACE/.verification/ntn-skills-cli/scripts/sdk-source-fixture.mjs"
      - name: Preserve current SDK results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-current-sdk-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/broker-artifacts-*/
            ${{ runner.temp }}/ntn-skills-current-fixture/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
